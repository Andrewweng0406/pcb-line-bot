{% if ai_error %}
<p class="text-sm mb-3" style="color: var(--gold)">{{ ai_error }}</p>
{% endif %}
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">層數 (Layer)</label>
        <input type="number" name="layer" required value="{{ form.layer or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">數量 (Qty)</label>
        <input type="number" name="qty" required value="{{ form.qty or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">材料 (Material)</label>
        <input type="text" name="material" value="{{ form.material or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">客戶公司名稱</label>
        <input type="text" name="company_name" value="{{ form.company_name or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">長 (mm)</label>
        <input type="number" step="0.01" name="length_mm" value="{{ form.length_mm or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">寬 (mm)</label>
        <input type="number" step="0.01" name="width_mm" value="{{ form.width_mm or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">投料率</label>
        <input type="number" step="0.01" name="issue_ratio" value="{{ form.issue_ratio or 1.0 }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">交期 (天)</label>
        <input type="number" name="delivery_days" value="{{ form.delivery_days or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">Pitch (mm)</label>
        <input type="number" step="0.01" name="pitch_mm" value="{{ form.pitch_mm or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">板厚 (mm)</label>
        <input type="number" step="0.01" name="thickness_mm" value="{{ form.thickness_mm or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">ENIG 厚度 (u")</label>
        <input type="number" step="0.01" name="enig_thickness_uinch" value="{{ form.enig_thickness_uinch or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">表面處理 (Surface Finish)</label>
        <input type="text" name="surface_finish" value="{{ form.surface_finish or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">銅厚 (Copper)</label>
        <input type="text" name="copper_weight" value="{{ form.copper_weight or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">外層銅厚 (oz)</label>
        <input type="number" step="0.01" name="copper_outer_oz" value="{{ form.copper_outer_oz or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">內層銅厚 (oz)</label>
        <input type="number" step="0.01" name="copper_inner_oz" value="{{ form.copper_inner_oz or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">最小孔徑 (mil)</label>
        <input type="number" step="0.01" name="min_hole_mil" value="{{ form.min_hole_mil or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">Line / Space (mil)</label>
        <input type="number" step="0.01" name="line_space_mil" value="{{ form.line_space_mil or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">Hole / Land (mil)</label>
        <input type="number" step="0.01" name="hole_land_mil" value="{{ form.hole_land_mil or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">縱橫比</label>
        <input type="number" step="0.01" name="aspect_ratio" value="{{ form.aspect_ratio or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">板翹 (mil/inch)</label>
        <input type="number" step="0.01" name="warpage_mil_per_inch" value="{{ form.warpage_mil_per_inch or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">文字顏色</label>
        <input type="text" name="legend_color" value="{{ form.legend_color or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">防焊顏色</label>
        <input type="text" name="solder_mask_color" value="{{ form.solder_mask_color or '' }}" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">
    </div>
    <div class="sm:col-span-2">
        <label class="block text-sm mb-1" style="color: var(--ink-muted)">特殊需求</label>
        <textarea name="special_requirements" rows="2" class="w-full border rounded-lg px-3 py-2" style="border-color: var(--border)">{{ form.special_requirements or '' }}</textarea>
    </div>
</div>
<div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-4">
    <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" name="enig" {% if form.enig %}checked{% endif %}> ENIG
    </label>
    <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" name="vip" {% if form.vip %}checked{% endif %}> VIP
    </label>
    <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" name="impedance" {% if form.impedance %}checked{% endif %}> Impedance
    </label>
    <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" name="back_drill" {% if form.back_drill %}checked{% endif %}> Back Drill
    </label>
    <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" name="bvh" {% if form.bvh %}checked{% endif %}> BVH
    </label>
    <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" name="hard_gold" {% if form.hard_gold %}checked{% endif %}> Hard Gold
    </label>
    <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" name="countersunk" {% if form.countersunk %}checked{% endif %}> Countersunk
    </label>
    <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" name="counterbored" {% if form.counterbored %}checked{% endif %}> Counterbored
    </label>
    <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" name="inspection_report_required" {% if form.inspection_report_required %}checked{% endif %}> Inspection Report
    </label>
</div>
